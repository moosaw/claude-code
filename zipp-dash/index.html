<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zipp Dash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <canvas id="game" tabindex="0" aria-label="Zipp Dash game. Press Enter to start."></canvas>
  <p class="keys">
    <span><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> run</span>
    <span><kbd>Space</kbd> jump</span>
    <span><kbd>↓</kbd> roll</span>
    <span><kbd>↓</kbd> + <kbd>Space</kbd> spin-dash</span>
    <span><kbd>P</kbd> pause</span>
    <span><kbd>M</kbd> mute</span>
  </p>
</main>
<script src="game.js"></script>
</body>
</html>
