<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Four in a Row</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centred column — scoreboard strip, the board as the hero, a quiet control row beneath. */
:root {
  --bg: #e9edf2;
  --fg: #17212c;
  --muted: #5b6878;
  --board: #24466b;
  --board-edge: #183252;
  --hole: #e9edf2;
  --p1: #f2a516;      /* marigold */
  --p1-deep: #c27f05;
  --p2: #e0465a;      /* coral red */
  --p2-deep: #a92a3c;
  --panel: #f8fafc;
  --line: #cfd7e1;
  --win: #ffffff;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151d; --fg: #e6ecf3; --muted: #93a1b2;
    --board: #1f3f63; --board-edge: #132b47; --hole: #0f151d;
    --p1: #f5b236; --p1-deep: #c4860f; --p2: #ec5b6e; --p2-deep: #b4384a;
    --panel: #18212c; --line: #2a3644; --win: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151d; --fg: #e6ecf3; --muted: #93a1b2;
  --board: #1f3f63; --board-edge: #132b47; --hole: #0f151d;
  --p1: #f5b236; --p1-deep: #c4860f; --p2: #ec5b6e; --p2-deep: #b4384a;
  --panel: #18212c; --line: #2a3644; --win: #ffffff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 24px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(1.9rem, 6vw, 2.6rem);
  letter-spacing: -0.02em;
  line-height: 1;
  margin: 0;
  text-wrap: balance;
}
h1 .four { color: var(--p2); }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.mode button {
  font: 700 0.8rem var(--body);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 0; background: transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 999px; cursor: pointer;
}
.mode button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.scores { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.player {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 12px;
  border: 2px solid transparent;
  transition: border-color .2s, background .2s;
  min-width: 0;
}
.player.p2 { flex-direction: row-reverse; text-align: right; }
.player.active { border-color: var(--line); background: var(--panel); }
.chip { width: 26px; height: 26px; border-radius: 50%; flex: none; }
.p1 .chip { background: var(--p1); box-shadow: inset 0 -3px 0 var(--p1-deep); }
.p2 .chip { background: var(--p2); box-shadow: inset 0 -3px 0 var(--p2-deep); }
.pname { font-weight: 700; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.pscore { font-family: var(--display); font-weight: 800; font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1; }
.vs { font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

.status {
  text-align: center; font-family: var(--display); font-weight: 500;
  font-size: 1.15rem; min-height: 1.6em; margin: 0;
}

.board-shell { position: relative; }
.board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 0;
  padding: 2.2%;
  background: var(--board);
  border-radius: 18px;
  box-shadow: 0 8px 0 var(--board-edge), 0 18px 30px rgb(0 0 0 / 0.18);
  aspect-ratio: 7 / 6.25;
  width: 100%;
  max-width: 100%;
  touch-action: manipulation;
}
.col {
  display: grid;
  grid-template-rows: repeat(6, 1fr);
  border: 0; background: transparent; padding: 0; margin: 0;
  cursor: pointer; border-radius: 10px;
  position: relative;
}
.col:focus-visible { outline: 3px solid var(--p1); outline-offset: -2px; }
.col:disabled { cursor: default; }
.cell { position: relative; display: grid; place-items: center; }
.hole {
  width: 80%; aspect-ratio: 1; border-radius: 50%;
  background: var(--hole);
  box-shadow: inset 0 4px 0 rgb(0 0 0 / 0.22);
  position: relative;
  overflow: visible;
}
.disc {
  position: absolute; inset: 0; border-radius: 50%;
  box-shadow: inset 0 -5px 0 rgb(0 0 0 / 0.18), inset 0 0 0 5px rgb(255 255 255 / 0.12);
}
.disc.p1 { background: var(--p1); }
.disc.p2 { background: var(--p2); }
.disc.drop { animation: drop var(--t, .4s) cubic-bezier(.45,0,.9,.55) both, bounce .22s ease-out var(--t, .4s); }
@keyframes drop { from { transform: translateY(calc(var(--rows) * -125%)); } to { transform: translateY(0); } }
@keyframes bounce { 0% { transform: translateY(0); } 40% { transform: translateY(-9%); } 100% { transform: translateY(0); } }
.disc.win::after {
  content: ""; position: absolute; inset: 28%; border-radius: 50%;
  border: 3px solid var(--win);
  animation: pulse 1s ease-in-out infinite alternate;
}
@keyframes pulse { from { transform: scale(.8); opacity: .65; } to { transform: scale(1.1); opacity: 1; } }

/* ghost disc above the hovered column */
.preview { display: grid; grid-template-columns: repeat(7, 1fr); padding-inline: 2.2%; padding-bottom: 8px; }
.preview span {
  width: 56%; aspect-ratio: 1; border-radius: 50%; justify-self: center;
  opacity: 0; transition: opacity .12s;
}
.preview span.show { opacity: .9; }
.preview span.p1 { background: var(--p1); }
.preview span.p2 { background: var(--p2); }

.controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  font: 700 0.95rem var(--body);
  border-radius: 10px; padding: 10px 18px; cursor: pointer;
  border: 2px solid var(--fg); background: var(--fg); color: var(--bg);
}
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .mode button:focus-visible { outline: 3px solid var(--p1); outline-offset: 2px; }
.hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0; }
kbd { font: 700 0.8em var(--body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }

@media (max-width: 420px) {
  .pname { font-size: 0.85rem; }
  .vs { display: none; }
  .scores { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .disc.drop { animation: none; }
  .disc.win::after { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Four in a Row</h1>
    <div class="mode" role="group" aria-label="Opponent">
      <button type="button" id="mode-cpu" aria-pressed="true">vs Computer</button>
      <button type="button" id="mode-two" aria-pressed="false">2 Players</button>
    </div>
  </header>

  <div class="scores">
    <div class="player p1 active" id="pl1"><span class="chip"></span><span class="pname" id="name1">You</span><span class="pscore" id="score1">0</span></div>
    <span class="vs">vs</span>
    <div class="player p2" id="pl2"><span class="chip"></span><span class="pname" id="name2">Computer</span><span class="pscore" id="score2">0</span></div>
  </div>

  <p class="status" id="status" aria-live="polite">Your move. Drop a disc.</p>

  <div class="board-shell">
    <div class="preview" id="preview" aria-hidden="true"></div>
    <div class="board" id="board" role="grid" aria-label="Game board, 7 columns"></div>
  </div>

  <div class="controls">
    <button type="button" class="btn" id="new">New game</button>
    <button type="button" class="btn ghost" id="undo">Undo</button>
    <button type="button" class="btn ghost" id="reset">Reset scores</button>
  </div>
  <p class="hint">Tap a column, or press <kbd>1</kbd>–<kbd>7</kbd>. Line up four across, down or diagonally.</p>
</div>

<script>
(() => {
  const COLS = 7, ROWS = 6;
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), previewEl = $('preview'), statusEl = $('status');

  let S; // game state

  function freshState(prev) {
    return {
      grid: Array.from({ length: ROWS }, () => Array(COLS).fill(0)), // row 0 = top
      turn: prev ? (prev.starter === 1 ? 2 : 1) : 1,
      starter: prev ? (prev.starter === 1 ? 2 : 1) : 1,
      history: [],
      winner: 0, winCells: [], draw: false,
      mode: prev ? prev.mode : 'cpu',
      scores: prev ? prev.scores : [0, 0],
    };
  }

  // ---------- rules ----------
  const openRow = (g, c) => { for (let r = ROWS - 1; r >= 0; r--) if (!g[r][c]) return r; return -1; };
  const DIRS = [[0,1],[1,0],[1,1],[1,-1]];
  function findWin(g, r, c) {
    const p = g[r][c];
    for (const [dr, dc] of DIRS) {
      const cells = [[r, c]];
      for (const s of [1, -1]) {
        let rr = r + dr*s, cc = c + dc*s;
        while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && g[rr][cc] === p) { cells.push([rr, cc]); rr += dr*s; cc += dc*s; }
      }
      if (cells.length >= 4) return cells;
    }
    return null;
  }
  const full = g => g[0].every(Boolean);

  // ---------- computer (minimax, alpha-beta) ----------
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  function scoreWindow(w, me) {
    const opp = me === 1 ? 2 : 1;
    let m = 0, o = 0, e = 0;
    for (const v of w) v === me ? m++ : v === opp ? o++ : e++;
    if (m === 4) return 1000;
    if (m === 3 && e === 1) return 6;
    if (m === 2 && e === 2) return 2;
    if (o === 3 && e === 1) return -8;
    if (o === 2 && e === 2) return -1;
    return 0;
  }
  function evaluate(g, me) {
    let s = 0;
    for (let r = 0; r < ROWS; r++) if (g[r][3] === me) s += 3;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) for (const [dr, dc] of DIRS) {
      const er = r + 3*dr, ec = c + 3*dc;
      if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
      s += scoreWindow([0,1,2,3].map(i => g[r+i*dr][c+i*dc]), me);
    }
    return s;
  }
  function minimax(g, depth, a, b, maxing, me) {
    const opp = me === 1 ? 2 : 1;
    if (depth === 0 || full(g)) return evaluate(g, me);
    let best = maxing ? -Infinity : Infinity;
    for (const c of ORDER) {
      const r = openRow(g, c); if (r < 0) continue;
      g[r][c] = maxing ? me : opp;
      let v;
      if (findWin(g, r, c)) v = maxing ? 100000 + depth : -100000 - depth;
      else v = minimax(g, depth - 1, a, b, !maxing, me);
      g[r][c] = 0;
      if (maxing) { best = Math.max(best, v); a = Math.max(a, v); }
      else { best = Math.min(best, v); b = Math.min(b, v); }
      if (a >= b) break;
    }
    return best;
  }
  function bestMove(g, me) {
    let best = -Infinity, choice = ORDER.find(c => openRow(g, c) >= 0);
    for (const c of ORDER) {
      const r = openRow(g, c); if (r < 0) continue;
      g[r][c] = me;
      const v = findWin(g, r, c) ? Infinity : minimax(g, 5, -Infinity, Infinity, false, me);
      g[r][c] = 0;
      if (v > best) { best = v; choice = c; }
    }
    return choice;
  }

  // ---------- rendering ----------
  const cols = [], holes = [];
  for (let c = 0; c < COLS; c++) {
    const col = document.createElement('button');
    col.type = 'button'; col.className = 'col'; col.dataset.c = c;
    col.setAttribute('aria-label', `Column ${c + 1}`);
    holes[c] = [];
    for (let r = 0; r < ROWS; r++) {
      const cell = document.createElement('div'); cell.className = 'cell';
      const hole = document.createElement('div'); hole.className = 'hole';
      cell.appendChild(hole); col.appendChild(cell); holes[c][r] = hole;
    }
    col.addEventListener('click', () => humanPlay(c));
    col.addEventListener('pointerenter', () => showPreview(c));
    col.addEventListener('focus', () => showPreview(c));
    col.addEventListener('pointerleave', () => showPreview(-1));
    boardEl.appendChild(col); cols.push(col);
    previewEl.appendChild(document.createElement('span'));
  }

  const cpuTurn = () => S.mode === 'cpu' && S.turn === 2 && !S.winner && !S.draw;
  const over = () => S.winner || S.draw;
  const names = () => S.mode === 'cpu' ? ['You', 'Computer'] : ['Player 1', 'Player 2'];

  function showPreview(c) {
    [...previewEl.children].forEach((s, i) => {
      s.className = (i === c && !over() && !cpuTurn() && openRow(S.grid, c) >= 0) ? `show p${S.turn}` : '';
    });
  }

  function render(dropAt) {
    for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
      const hole = holes[c][r], v = S.grid[r][c];
      const want = v ? `disc p${v}` : '';
      let disc = hole.firstChild;
      if (!v) { if (disc) disc.remove(); continue; }
      if (!disc) { disc = document.createElement('div'); hole.appendChild(disc); }
      const isDrop = dropAt && dropAt[0] === r && dropAt[1] === c;
      disc.className = want + (isDrop ? ' drop' : '');
      if (isDrop) { disc.style.setProperty('--rows', r + 1); disc.style.setProperty('--t', (0.18 + r * 0.06) + 's'); }
    }
    for (const [r, c] of S.winCells) holes[c][r].firstChild.classList.add('win');

    const [n1, n2] = names();
    $('name1').textContent = n1; $('name2').textContent = n2;
    $('score1').textContent = S.scores[0]; $('score2').textContent = S.scores[1];
    $('pl1').classList.toggle('active', !over() && S.turn === 1);
    $('pl2').classList.toggle('active', !over() && S.turn === 2);
    $('mode-cpu').setAttribute('aria-pressed', S.mode === 'cpu');
    $('mode-two').setAttribute('aria-pressed', S.mode === 'two');

    const who = S.turn === 1 ? n1 : n2;
    if (S.winner) statusEl.textContent = S.mode === 'cpu' ? (S.winner === 1 ? 'You win! Four in a row.' : 'The computer wins this one.') : `${S.winner === 1 ? n1 : n2} wins!`;
    else if (S.draw) statusEl.textContent = 'Board full. It’s a draw.';
    else if (cpuTurn()) statusEl.textContent = 'Computer is thinking…';
    else statusEl.textContent = S.mode === 'cpu' ? 'Your move. Drop a disc.' : `${who}’s turn.`;

    cols.forEach((col, c) => {
      col.disabled = over() || cpuTurn() || openRow(S.grid, c) < 0;
      col.setAttribute('aria-label', `Column ${c + 1}${openRow(S.grid, c) < 0 ? ', full' : ''}`);
    });
    $('undo').disabled = !S.history.length || cpuTurn();
  }

  function play(c) {
    if (over()) return false;
    const r = openRow(S.grid, c); if (r < 0) return false;
    S.grid[r][c] = S.turn;
    S.history.push([r, c]);
    const win = findWin(S.grid, r, c);
    if (win) { S.winner = S.turn; S.winCells = win; S.scores[S.turn - 1]++; }
    else if (full(S.grid)) S.draw = true;
    else S.turn = S.turn === 1 ? 2 : 1;
    render([r, c]);
    return true;
  }

  let cpuTimer = 0;
  function maybeCpu() {
    clearTimeout(cpuTimer);
    if (!cpuTurn()) return;
    render();
    cpuTimer = setTimeout(() => {
      const c = bestMove(S.grid.map(row => row.slice()), 2);
      play(c);
      showPreview(-1);
    }, 450);
  }

  function humanPlay(c) {
    if (cpuTurn()) return;
    if (play(c)) { showPreview(over() ? -1 : c); maybeCpu(); }
  }

  function newGame() { clearTimeout(cpuTimer); S = freshState(S); render(); maybeCpu(); }

  $('new').addEventListener('click', newGame);
  $('reset').addEventListener('click', () => { S.scores = [0, 0]; render(); });
  $('undo').addEventListener('click', () => {
    if (!S.history.length || cpuTurn()) return;
    // in vs-computer mode, take back your move and the computer's reply
    const steps = S.mode === 'cpu' ? (S.history.length >= 2 && (S.winner !== 1) ? 2 : 1) : 1;
    if (S.winner) S.scores[S.winner - 1]--;
    for (let i = 0; i < steps && S.history.length; i++) {
      const [r, c] = S.history.pop();
      S.turn = S.grid[r][c];
      S.grid[r][c] = 0;
    }
    S.winner = 0; S.winCells = []; S.draw = false;
    render(); maybeCpu();
  });
  function setMode(m) { if (S.mode === m) return; S.mode = m; S.scores = [0, 0]; S.starter = 2; newGame(); }
  $('mode-cpu').addEventListener('click', () => setMode('cpu'));
  $('mode-two').addEventListener('click', () => setMode('two'));

  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= COLS) { humanPlay(n - 1); }
    else if (e.key.toLowerCase() === 'n') newGame();
  });

  function start(saved) {
    S = saved && saved.grid ? saved : freshState();
    render(); maybeCpu();
  }
  window.claude?.hot?.snapshot?.(() => S);
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
